name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: npm run check

      - name: Validate manifests and locales
        shell: bash
        run: |
          node -e "for (const file of ['package.json', 'locale/en.json', 'locale/zh.json']) { JSON.parse(require('node:fs').readFileSync(file, 'utf8')) } console.log('JSON OK')"

      - name: Run tests
        run: npm test
